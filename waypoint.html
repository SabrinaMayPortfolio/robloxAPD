:7px\">What is happening? <span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent)\">only you can tell us this<\u002Fspan><\u002Flabel>\n          <textarea class=\"input\" ref=\"{{ report.ref }}\" placeholder=\"Specimen labels are not printing after collection.\" style=\"min-height:74px;resize:vertical;font-family:var(--font-body)\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:12.5px\">\n            <span style=\"color:var(--color-neutral-500)\">Impact<\u002Fspan>\n            <div class=\"seg\">\n              <sc-for list=\"{{ report.severities }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <label class=\"seg-opt\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"cursor:pointer;font-size:12px\">\n                  <sc-if value=\"{{ s.active }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--color-accent);display:inline-block;margin-right:6px\"><\u002Fspan><\u002Fsc-if>\n                  {{ s.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--color-neutral-500)\">Support pair and Hospital IT contact are attached automatically.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ report.onCancel }}\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ report.onSubmit }}\">Create issue &amp; investigate<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirm.open }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:45;backdrop-filter:blur(2px)\">\n      <div class=\"dialog\" style=\"width:min(520px,100%);animation:fadeUp .18s ease\">\n        <div class=\"dialog-title\">Make this amendment?<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-neutral-400)\">You are proposing a location change for<\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--font-heading);font-weight:500;font-size:18px\">{{ confirm.deviceId }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-400)\">{{ confirm.deviceType }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center\">\n          <div style=\"padding:10px 11px;border-radius:7px;background:rgba(9,10,18,.34);box-shadow:inset 0 1px 3px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03)\">\n            <div style=\"font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500)\">From<\u002Fdiv>\n            <div style=\"margin-top:3px;font-size:12.5px;color:var(--color-neutral-400)\">{{ confirm.from }}<\u002Fdiv>\n          <\u002Fdiv>\n          <i class=\"ph ph-arrow-right\" style=\"color:var(--color-accent)\"><\u002Fi>\n          <div style=\"padding:10px 11px;border-radius:7px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38)\">\n            <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">To<\u002Fdiv>\n            <div style=\"margin-top:3px;font-size:12.5px\">{{ confirm.to }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-400);line-height:1.6\">This amendment will update the go-live operational view and will be visible to project leadership and Hospital IT until the underlying device record is verified.<\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ confirm.onCancel }}\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ confirm.onSave }}\">Save amendment<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ draft.open }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:46;backdrop-filter:blur(2px)\">\n      <div class=\"dialog\" style=\"width:min(600px,100%);animation:fadeUp .18s ease\">\n        <div>\n          <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">Drafted from the record check · review before sending<\u002Fdiv>\n          <div class=\"dialog-title\" style=\"margin-top:4px\">Hardware naming discrepancy<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label style=\"font-size:11.5px\">Report<\u002Flabel>\n          <textarea class=\"input\" ref=\"{{ draft.ref }}\" default-value=\"{{ draft.body }}\" style=\"min-height:230px;resize:vertical;font-family:var(--font-body);font-size:12.5px;line-height:1.6\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11.5px;color:var(--color-neutral-500)\">Recommended recipient<\u002Fdiv>\n          <div style=\"margin-top:7px;display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ draft.recipients }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <span sc-camel-on-click=\"{{ r.onClick }}\" style=\"position:relative;padding:5px 11px;border-radius:7px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);cursor:pointer;font-size:12px\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n                <sc-if value=\"{{ r.selected }}\"><span style=\"position:absolute;inset:0;border-radius:7px;box-shadow:0 0 0 1px var(--color-accent);background:color-mix(in srgb, var(--color-accent) 10%, transparent)\"><\u002Fspan><\u002Fsc-if>\n                <span style=\"position:relative\">{{ r.label }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ draft.onCancel }}\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ draft.onSend }}\">Send to {{ draft.recipient }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ drawer.open }}\">\n    <div sc-camel-on-click=\"{{ drawer.onBackdrop }}\" style=\"position:fixed;inset:0;z-index:30;background:rgba(10,11,18,.5)\"><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ drawer.open }}\">\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:566px;z-index:31;background:rgba(22,24,39,.82);backdrop-filter:blur(22px) saturate(1.1);box-shadow:inset 1px 0 0 rgba(255,255,255,.07), -1px 0 0 rgba(0,0,0,.6), -28px 0 70px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:slideIn .22s ease\">\n      <div style=\"padding:14px 16px;box-shadow:0 1px 0 var(--color-divider)\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <span style=\"flex:0 0 auto;white-space:nowrap;font-size:11.5px;color:var(--color-neutral-500)\">{{ drawer.id }}<\u002Fspan>\n          <span class=\"tag {{ drawer.severityTag }}\" style=\"font-size:10px\">{{ drawer.severity }}<\u002Fspan>\n          <i class=\"ph ph-x\" sc-camel-on-click=\"{{ drawer.onClose }}\" style=\"margin-left:auto;cursor:pointer;color:var(--color-neutral-400)\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"margin-top:6px;font-family:var(--font-heading);font-weight:500;font-size:19px;line-height:1.25;text-wrap:pretty\">{{ drawer.title }}<\u002Fdiv>\n        <div style=\"margin-top:11px;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38)\">\n          <div style=\"min-width:0\">\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Who has the ball<\u002Fdiv>\n            <sc-if value=\"{{ drawer.calm }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:3px;display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:7px;background:var(--color-accent-800);color:var(--color-accent-100);font-size:12.5px\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:var(--color-accent-200)\"><\u002Fspan>{{ drawer.statusLabel }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ drawer.pulse }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:3px;display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:7px;background:var(--color-accent-800);color:var(--color-accent-100);font-size:12.5px;animation:pillIn .6s ease\">\n                <span style=\"width:6px;height:6px;border-radius:50%;background:var(--color-accent-200)\"><\u002Fspan>{{ drawer.statusLabel }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"margin-left:auto;text-align:right;font-size:11.5px;color:var(--color-neutral-400);line-height:1.5\">Next: {{ drawer.next }}<br>Updated {{ drawer.updated }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ drawer.showHandoff }}\">\n          <div style=\"margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-400);animation:fadeUp .3s ease\">\n            <span>{{ drawer.handoffFrom }}<\u002Fspan><i class=\"ph ph-arrow-right\" style=\"color:var(--color-accent)\"><\u002Fi><span style=\"color:var(--color-text)\">{{ drawer.handoffTo }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <span style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Context<\u002Fspan>\n            <i class=\"ph ph-link-simple\" style=\"font-size:12px;color:var(--color-accent)\"><\u002Fi>\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">inherited from where it was reported<\u002Fspan>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ drawer.onShowOnMap }}\" style=\"margin-left:auto;font-size:11.5px\">Show on map<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px\">\n            <sc-for list=\"{{ drawer.context }}\" as=\"c\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:7px 9px;border-radius:7px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), rgba(32,35,54,.66);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.055);font-size:12px;cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n                <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600)\">{{ c.k }}<\u002Fdiv>\n                <div style=\"margin-top:2px\">{{ c.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ drawer.hasAmend }}\">\n            <div sc-camel-on-click=\"{{ drawer.onOpenAmend }}\" style=\"margin-top:7px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;background:linear-gradient(180deg, rgba(217,168,79,.20), rgba(217,168,79,.07));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px var(--amber);cursor:pointer;font-size:11.5px;color:var(--amber-text)\">\n              <i class=\"ph ph-pencil-simple-line\"><\u002Fi><span>{{ drawer.amendId }} · {{ drawer.amendLine }}<\u002Fspan><i class=\"ph ph-arrow-right\" style=\"margin-left:auto\"><\u002Fi>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Reported<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:13px;line-height:1.6\">{{ drawer.body }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <span style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Device &amp; configuration<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">permission-aware retrieval<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);overflow:hidden\">\n            <sc-for list=\"{{ drawer.device }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:10px;padding:8px 11px;border-bottom:1px solid var(--color-divider);font-size:12.5px;align-items:baseline\">\n                <span style=\"width:132px;flex:0 0 132px;color:var(--color-neutral-500)\">{{ d.k }}<\u002Fspan>\n                <span style=\"min-width:0\">{{ d.v }}<\u002Fspan>\n                <sc-if value=\"{{ d.flagged }}\"><span class=\"tag tag-outline\" style=\"margin-left:auto;white-space:nowrap\">mismatch<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"padding:9px 11px;display:flex;gap:10px;align-items:center;background:rgba(9,10,18,.34);box-shadow:inset 0 1px 3px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03)\">\n              <i class=\"ph ph-lock-simple\" style=\"color:var(--color-neutral-400)\"><\u002Fi>\n              <div style=\"font-size:12px;line-height:1.5;min-width:0\">\n                <div>Print spooler configuration and device group membership are restricted to Hospital IT.<\u002Fdiv>\n                <div style=\"color:var(--color-neutral-500)\">You can request verification with this issue's context attached.<\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ drawer.onRequestVerify }}\" style=\"margin-left:auto;white-space:nowrap;font-size:12px\">{{ drawer.verifyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div sc-camel-on-click=\"{{ drawer.onToggleSimilar }}\" style=\"display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38);cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n            <i class=\"ph ph-git-diff\" style=\"color:var(--color-accent)\"><\u002Fi>\n            <span style=\"font-size:13px\">{{ drawer.similarCount }} similar incidents found in past go-lives<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:11.5px;color:var(--color-neutral-400)\">{{ drawer.similarHint }}<\u002Fspan>\n            <i class=\"ph ph-caret-down\" style=\"color:var(--color-neutral-400)\"><\u002Fi>\n          <\u002Fdiv>\n          <sc-if value=\"{{ drawer.similarOpen }}\">\n            <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .2s ease\">\n              <sc-for list=\"{{ drawer.similar }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"padding:11px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n                  <div style=\"display:flex;align-items:baseline;gap:9px\">\n                    <span style=\"flex:0 0 auto;white-space:nowrap;font-size:11.5px;color:var(--color-neutral-500)\">{{ s.ref }}<\u002Fspan>\n                    <span style=\"font-size:12.5px\">{{ s.site }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-size:11px;color:var(--color-neutral-500)\">{{ s.when }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:6px;font-size:12.5px;line-height:1.55\">{{ s.title }}<\u002Fdiv>\n                  <div style=\"margin-top:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Matched on<\u002Fdiv>\n                  <div style=\"margin-top:5px;display:flex;flex-wrap:wrap;gap:5px\">\n                    <sc-for list=\"{{ s.matches }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <span class=\"tag tag-accent\" style=\"font-size:10.5px\">{{ m.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:9px;padding:8px 10px;border-radius:6px;background:rgba(9,10,18,.34);box-shadow:inset 0 1px 3px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03);font-size:12px;line-height:1.55\">\n                    <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600)\">How it was resolved<\u002Fdiv>\n                    <div style=\"margin-top:3px\">{{ s.resolution }}<\u002Fdiv>\n                    <div style=\"margin-top:5px;color:var(--color-neutral-500)\">{{ s.resolvedBy }} · {{ s.duration }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:9px;display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-size:11.5px;color:var(--color-neutral-400)\">{{ s.reuse }}<\u002Fspan>\n                    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ s.onUse }}\" style=\"margin-left:auto;font-size:12px;white-space:nowrap\">Use as my working theory<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:11.5px;color:var(--color-neutral-500);line-height:1.5\">Matches are attribute overlap on device class, workflow and failure signature. Read the evidence and decide. None of this has been applied.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ drawer.theoryOn }}\">\n          <div style=\"padding:11px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38);animation:fadeUp .2s ease\">\n            <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">Your working theory<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:12.5px;line-height:1.55\">{{ drawer.theory }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ drawer.routingOpen }}\">\n          <div>\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Route the next action<\u002Fdiv>\n            <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ drawer.routes }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"position:relative;padding:10px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n                  <sc-if value=\"{{ r.selected }}\"><span style=\"position:absolute;inset:0;border-radius:8px;box-shadow:0 0 0 1px var(--color-accent);background:color-mix(in srgb, var(--color-accent) 9%, transparent)\"><\u002Fspan><\u002Fsc-if>\n                  <div style=\"position:relative;display:flex;align-items:center;gap:9px\">\n                    <span style=\"width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-divider);display:grid;place-items:center;overflow:hidden;position:relative;font-size:10px\">\n                      <sc-if value=\"{{ r.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\"><img ref=\"{{ r.imgRef }}\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%\"><\u002Fsc-if>\n                      <sc-if value=\"{{ r.noPhoto }}\">{{ r.initials }}<\u002Fsc-if>\n                    <\u002Fspan>\n                    <div style=\"min-width:0\">\n                      <div style=\"font-size:12.5px\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:var(--color-neutral-500)\">{{ r.role }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ r.recommended }}\"><span class=\"tag
