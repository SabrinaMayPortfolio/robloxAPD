  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-display: swap;\n  src: url(\"7b38a59c-6909-4db1-a02a-aff0e2d5bf50\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"434b99a4-24d3-4700-b1b8-77162ec71a8a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d5abb46d-4496-4f03-8e3d-caf16e21d1d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f9b64f15-dbe9-494c-9a57-d639c2f31743\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: ,52,.08)); color: var(--stat-red-text); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(214,72,52,.5); border-color: transparent; }\n    .tag-amber { background: linear-gradient(180deg, rgba(217,168,79,.22), rgba(217,168,79,.08)); color: var(--amber-text); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(217,168,79,.5); border-color: transparent; }\n    .tag-green { background: linear-gradient(180deg, rgba(64,178,120,.22), rgba(64,178,120,.08)); color: var(--stat-green-text); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(64,178,120,.5); border-color: transparent; }\n    .dialog { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.012)), rgba(26,29,46,.82); backdrop-filter: blur(24px) saturate(1.15); box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.6); }\n    .dialog-backdrop { background: rgba(7,8,15,.58); }\n    .input { background: rgba(9,10,18,.4); box-shadow: inset 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.07); border-color: transparent; }\n    .input:focus-visible { box-shadow: inset 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px rgba(145,132,217,.55); }\n    .btn-secondary, .btn-ghost { backdrop-filter: blur(8px); }\n    :root { --dev-ws: oklch(0.62 0.11 258); --dev-vc: oklch(0.66 0.10 168); --dev-p: oklch(0.74 0.11 86); --dev-vm: oklch(0.64 0.11 300); }\n    :root { --amber: oklch(0.76 0.12 80); --amber-dim: oklch(0.34 0.055 80); --amber-text: oklch(0.88 0.07 82); }\n    ::-webkit-scrollbar { width:9px; height:9px; }\n    ::-webkit-scrollbar-thumb { background:#3f424d; border-radius:8px; }\n    ::-webkit-scrollbar-track { background:transparent; }\n    @keyframes pillIn { 0% { opacity:0; transform:translateY(-4px); box-shadow:0 0 0 6px rgba(145,132,217,.28); } 100% { opacity:1; transform:none; box-shadow:0 0 0 0 rgba(145,132,217,0); } }\n    @keyframes fadeUp { from { opacity:0; transform:translateY  style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400);white-space:nowrap\">On this project<\u002Fdiv>\n              <div style=\"margin-top:9px;display:flex;flex-direction:column;gap:3px\">\n                <sc-for list=\"{{ trip.team }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:center;gap:9px;padding:6px;border-radius:7px\" style-hover=\"background:color-mix(in srgb, var(--color-text) 6%, transparent)\">\n                    <span style=\"width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:{{ p.bg }};display:grid;place-items:center;font-size:10px\">{{ p.initials }}<\u002Fspan>\n                    <div style=\"flex:1 1 auto;min-width:0;line-height:1.3\">\n                      <div style=\"font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:var(--color-neutral-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.role }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <i class=\"ph ph-chat-circle\" sc-camel-on-click=\"{{ p.onMessage }}\" style=\"flex:0 0 auto;font-size:15px;color:var(--color-neutral-400);cursor:pointer\" style-hover=\"color:var(--color-accent)\"><\u002Fi>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px;border-radius:9px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n              <div style=\"font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400);white-space:nowrap\">More info<\u002Fdiv>\n              <div style=\"margin-top:9px;display:flex radius:7px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n                      <div style=\"font-size:12.5px\">{{ i.title }}<\u002Fdiv>\n                      <div style=\"margin-top:4px;font-size:11px;color:var(--color-neutral-500)\">{{ i.id }} · {{ i.statusLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:15px;display:flex;gap:7px\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ personPanel.onChat }}\"><i class=\"ph ph-chat-circle\"><\u002Fi> Message<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ personPanel.onLocate }}\"><i class=\"ph ph-crosshair\"><\u002Fi> Show on map<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isChats }}\">\n      <div style=\"flex:1;min-height:0;display:flex;overflow:hidden\">\n        <div style=\"width:248px;flex:0 0 248px;padding:12px 10px;overflow:auto;box-shadow:1px 0 0 var(--color-divider)\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <sc-for list=\"{{ chatList }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"position:relative;padding:9px;border-radius:7px;cursor:pointer\" style-hover=\"background:color-mix(in srgb, var(--color-text) 6%, transparent)\">\n                <sc-if value=\"{{ c.active }}\"><span style=\"position:absolute;inset:0;border-radius:7px;background:color-mix(in srgb, var(--color-accent) 13%, transparent)\"><\u002Fspan><\u002Fsc-if>\n                <div style=\"position:relative;display:flex;align-items:center;gap:7px\">\n                  <i class=\"ph {{ c.icon }}\" style=\"font-size:13px;color:var(--color-accent)\"><\u002Fi>\n                  <span style=\"font-size:12.5px\">{{ c.name }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"position:relative;margin-top:3px;font-size:11px;color:var(--color-neutral-500);line-height:1.4\">{{ c.scope }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ onNewChat }}\"><i class=\"ph ph-plus\"><\u002Fi> New chat<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noChats }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1;min-width:0;display:grid;place-items:center;padding:24px\">\n            <div style=\"max-width:320px;text-align:center\">\n              <i class=\"ph ph-chat-circle\" style=\"font-size:26px;color:var(--color-neutral-600)\"><\u002Fi>\n              <div style=\"margin-top:9px;font-size:14px\">No conversations<\u002Fdiv>\n              <div style=\"margin-top:5px;font-size:12px;color:var(--color-neutral-500);line-height:1.6\">Start one from a person, a room on the map, or search a unit or wing to message everyone assigned to it.<\u002Fdiv>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onNewChat }}\" style=\"margin-top:12px\"><i class=\"ph ph-plus\"><\u002Fi> New chat<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasChats }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n          <div style=\"padding:11px 16px;box-shadow:0 1px 0 var(--color-divider)\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14px\">{{ chat.name }}<\u002Fdiv>\n                <div style=\"margin-top:3px;font-size:11.5px;color:var(--color-neutral-500)\">{{ chat.scope }} · {{ chat.members }} members added by assignment<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ chat.hasOwner }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-outline\" style=\"margin-left:auto;white-space:nowrap\">{{ chat.owner }}<\u002Fspan><\u002Fsc-if>\n              <div style=\"position:relative;margin-left:auto;flex:0 0 auto\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ onToggleChatMenu }}\" style=\"padding:4px 8px\"><i class=\"ph ph-dots-three\" style=\"font-size:16px\"><\u002Fi><\u002Fbutton>\n                <sc-if value=\"{{ chatMenu }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:absolute;right:0;top:32px;z-index:20;min-width:186px;padding:5px;border-radius:8px;background:rgba(32,36,60,.86);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 0 0 1px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px;animation:fadeUp .14s ease\">\n                    <div sc-camel-on-click=\"{{ onLeaveChat }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12.5px\" style-hover=\"background:color-mix(in srgb, var(--color-text) 8%, transparent)\"><i class=\"ph ph-sign-out\" style=\"font-size:14px;color:var(--color-neutral-400)\"><\u002Fi>Leave conversation<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ onReportChat }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12.5px\" style-hover=\"background:color-mix(in srgb, var(--color-text) 8%, transparent)\"><i class=\"ph ph-flag\" style=\"font-size:14px;color:var(--color-neutral-400)\"><\u002Fi>Report conversation<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ onDeleteChat }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--amber-text)\" style-hover=\"background:var(--amber-dim)\"><i class=\"ph ph-trash\" style=\"font-size:14px\"><\u002Fi>Delete conversation<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ chat.hasLink }}\">\n              <div sc-camel-on-click=\"{{ chat.onOpenLink }}\" style=\"margin-top:8px;display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;background:#1e2132;box-shadow:0 0 0 1px var(--color-accent-800);font-size:11.5px;cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n                <i class=\"ph ph-link-simple\" style=\"color:var(--color-accent)\"><\u002Fi><span>{{ chat.linkLabel }}<\u002Fspan><span style=\"color:var(--color-neutral-500)\">{{ chat.linkKind }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ chat.messages }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:9px\">\n                <span style=\"width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:{{ m.avatarBg }};display:grid;place-items:center;overflow:hidden;position:relative;font-size:10px\">\n                  <sc-if value=\"{{ m.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\"><img ref=\"{{ m.imgRef }}\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%\"><\u002Fsc-if>\n                  <sc-if value=\"{{ m.noPhoto }}\">{{ m.initials }}<\u002Fsc-if>\n                <\u002Fspan>\n                <div style=\"min-width:0;flex:1 1 auto\">\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-500)\">{{ m.who }} · {{ m.time }}<\u002Fdiv>\n                  <sc-if value=\"{{ m.plain }}\"><div style=\"margin-top:3px;font-size:13px;line-height:1.55\">{{ m.text }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ m.isReport }}\">\n                    <div style=\"margin-top:5px;padding:11px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38)\">\n                      <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">Hardware naming discrepancy<\u002Fdiv>\n                      <div style=\"margin-top:6px;font-size:12.5px;line-height:1.65;white-space:pre-wrap\">{{ m.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:12px 16px;box-shadow:0 -1px 0 var(--color-divider);display:flex;gap:8px;align-items:center\">\n            <input class=\"input\" placeholder=\"Message the unit. Mention @role to reach whoever holds it\" ref=\"{{ chatInputRef }}\" sc-camel-on-key-down=\"{{ onChatKey }}\" style=\"flex:1;height:32px;font-size:12.5px\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onChatSend }}\" style=\"height:32px\">Send<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAmendments }}\">\n      <div style=\"flex:1;min-height:0;overflow:auto;padding:14px 16px\">\n        <div style=\"font-size:12.5px;color:var(--color-neutral-400);max-width:660px;line-height:1.6\">Floor plans and device records arrive imperfect. Corrections observed onsite are proposed as amendments, visible to the implementation team, project leadership and Hospital IT, and the hospital's own record is only changed once an authorized team verifies them.<\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:7px\">\n          <sc-for list=\"{{ amendments }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ a.onClick }}\" style=\"padding:12px 13px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);cursor:pointer\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <i class=\"ph {{ a.icon }}\" style=\"font-size:14px;color:var(--color-accent)\"><\u002Fi>\n                <span style=\"flex:0 0 auto;white-space:nowrap;font-size:11.5px;color:var(--color-neutral-500)\">{{ a.id }}<\u002Fspan>\n                <span style=\"font-size:13.5px\">{{ a.object }}<\u002Fspan>\n                <span style=\"font-size:11.5px;color:var(--color-neutral-500)\">{{ a.changeType }}<\u002Fspan>\n                <span class=\"tag {{ a.tagClass }}\" style=\"margin-left:auto;white-space:nowrap\">{{ a.status }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:12.5px\">\n                <div style=\"padding:8px 10px;border-radius:6px;background:rgba(9,10,18,.34);box-shadow:inset 0 1px 3px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03)\">\n                  <div style=\"font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500)\">Previous value<\u002Fdiv>\n                  <div style=\"margin-top:3px;color:var(--color-neutral-400)\">{{ a.before }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:8px 10px;border-radius:6px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38)\">\n                  <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">Proposed value<\u002Fdiv>\n                  <div style=\"margin-top:3px\">{{ a.after }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:11.5px;color:var(--color-neutral-500)\">Submitted by {{ a.by }} · {{ a.when }} · assigned to {{ a.reviewer }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProject }}\">\n      <div style=\"flex:1;min-height:0;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-content:start\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"padding:13px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Workflow readiness<\u002Fdiv>\n            <sc-raw-table class=\"table\" style=\"margin-top:9px;width:100%;font-size:12.5px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Workflow<\u002Fsc-raw-th><sc-raw-th>Verified by<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ workflows }}\" as=\"w\" hint-placeholder-count=\"6\">\n                  <sc-raw-tr><sc-raw-td>{{ w.name }}<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--color-neutral-400)\">{{ w.by }}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag {{ w.tagClass }}\">{{ w.status }}<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"padding:13px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Latest project updates<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ updates }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:12.5px\">{{ u.text }}<div style=\"font-size:11px;color:var(--color-neutral-500);margin-top:2px\">{{ u.source }} · {{ u.time }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"padding:13px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Build<\u002Fdiv>\n            <div style=\"margin-top:7px;font-size:12.5px;line-height:1.7\">24.3.1 · deployed Mon 4:00 AM<br><span style=\"color:var(--color-neutral-400)\">Hotfix 24.3.1-p2 staged for Wed 2:00 AM and includes a label print device mapping fix<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:13px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012)), rgba(28,31,48,.72);backdrop-filter:blur(14px) saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7)\">\n            <div style=\"flex:0 0 auto;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-400)\">Support load<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;flex-direction:column;gap:7px;font-size:12.5px\">\n              <div style=\"display:flex\"><span>Day 2 of 4<\u002Fspan><span style=\"margin-left:auto;color:var(--color-neutral-400)\">go-live window<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span>{{ counts.resolved }} resolved<\u002Fspan><span style=\"margin-left:auto;color:var(--color-neutral-400)\">since cutover<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span>{{ counts.blockers }} blocking<\u002Fspan><span style=\"margin-left:auto;color:var(--color-neutral-400)\">workflow-affecting<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span>{{ counts.waiting }} awaiting others<\u002Fspan><span style=\"margin-left:auto;color:var(--color-neutral-400)\">outside the team<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span>{{ counts.pendingAmends }} amendments<\u002Fspan><span style=\"margin-left:auto;color:var(--color-neutral-400)\">awaiting verification<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:11px;font-size:11.5px;color:var(--color-neutral-500);line-height:1.5\">Specimen labeling in Triage is unverified, so the clinic is not signed off regardless of ticket count.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ assistantOpen }}\">\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:330px;z-index:28;display:flex;flex-direction:column;background:rgba(22,24,39,.95);backdrop-filter:blur(24px) saturate(1.1);box-shadow:inset 1px 0 0 rgba(255,255,255,.07), -1px 0 0 rgba(0,0,0,.55), -26px 0 60px rgba(0,0,0,.55);animation:slideIn .18s ease\">\n      <div style=\"padding:11px 13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--color-divider)\">\n        <i class=\"ph ph-sparkle\" style=\"color:var(--color-accent)\"><\u002Fi>\n        <span style=\"font-size:13px\">Assistant<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--color-neutral-500)\">context: {{ ctxLabel }}<\u002Fspan>\n        <i class=\"ph ph-x\" sc-camel-on-click=\"{{ toggleAssistant }}\" style=\"margin-left:auto;cursor:pointer;color:var(--color-neutral-400)\"><\u002Fi>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-height:0;overflow:auto;padding:12px 13px;display:flex;flex-direction:column;gap:11px\">\n        <sc-for list=\"{{ assistantLog }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <div>\n            <sc-if value=\"{{ m.isUser }}\">\n              <div style=\"margin-left:auto;max-width:88%;padding:8px 11px;border-radius:9px;background:#242845;font-size:12.5px\">{{ m.text }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.isBot }}\">\n              <div style=\"font-size:12.5px;line-height:1.6\">\n                <div>{{ m.text }}<\u002Fdiv>\n                <sc-if value=\"{{ m.isNaming }}\">\n                  <div style=\"margin-top:8px;padding:10px 11px;border-radius:8px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38)\">\n                    <div style=\"display:flex;gap:10px;font-size:12px;padding:2px 0\"><span style=\"width:112px;flex:0 0 112px;color:var(--color-neutral-500)\">Expected format<\u002Fspan><span>P-ER-##<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;gap:10px;font-size:12px;padding:2px 0\"><span style=\"width:112px;flex:0 0 112px;color:var(--color-neutral-500)\">Registered<\u002Fspan><span>P-ER-04 · ER-110<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;gap:10px;font-size:12px;padding:2px 0\"><span style=\"width:112px;flex:0 0 112px;color:var(--color-neutral-500)\">Observed onsite<\u002Fspan><span style=\"color:var(--amber-text)\">LABPRNTR402<\u002Fspan><\u002Fdiv>\n                    <div style=\"margin-top:8px;font-size:12px;color:var(--color-neutral-400);line-height:1.5\">Would you like me to draft a discrepancy report for the EUD team?<\u002Fdiv>\n                    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ m.onDraft }}\" style=\"margin-top:8px;font-size:12px\">Create report<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ m.hasSources }}\">\n                  <div style=\"margin-top:7px;display:flex;gap:5px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ m.sources }}\" as=\"s\" hint-placeholder-count=\"2\">\n                      <span style=\"display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), rgba(32,35,54,.66);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(255,255,255,.055);font-size:10.5px;color:var(--color-neutral-400)\"><i class=\"ph ph-database\" style=\"font-size:10px\"><\u002Fi>{{ s.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ m.hasAction }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ m.onAction }}\" style=\"margin-top:6px;font-size:12px\"> :4px 8px\"><i class=\"ph ph-chat-circle\" style=\"font-size:15px\"><\u002Fi><\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.isMe }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-accent\" style=\"font-size:10px\">you<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ composer.open }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:44;backdrop-filter:blur(2px)\">\n      <div class=\"dialog\" style=\"width:min(520px,100%);animation:fadeUp .18s ease\">\n        <div class=\"dialog-title\">New chat<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-neutral-400);line-height:1.55\">Search a person, a role, a unit or a wing. Searching a place selects everyone assigned to it.<\u002Fdiv>\n        <div style=\"position:relative;display:flex;align-items:center\">\n          <i class=\"ph ph-magnifying-glass\" style=\"position:absolute;left:10px;font-size:14px;color:var(--color-neutral-500)\"><\u002Fi>\n          <input class=\"input\" sc-camel-on-change=\"{{ composer.onQuery }}\" placeholder=\"Try “triage”, “emergency”, “west wing”, or a name\" style=\"width:100%;padding-left:31px;height:34px;font-size:12.5px\">\n        <\u002Fdiv>\n        <sc-if value=\"{{ composer.showSelectAll }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ composer.onSelectAll }}\" style=\"display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;background:linear-gradient(180deg, rgba(145,132,217,.19), rgba(145,132,217,.055));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(145,132,217,.38);cursor:pointer;font-size:12.5px\" style-hover=\"box-shadow:0 0 0 1px var(--color-accent)\">\n            <i class=\"ph ph-users-three\" style=\"color:var(--color-accent)\"><\u002Fi>\n            <span>Select all {{ composer.matchCount }} m x;color:var(--color-neutral-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.picked }}\" hint-placeholder-val=\"{{ false }}\"><i class=\"ph ph-check-circle\" style=\"position:relative;font-size:16px;color:var(--color-accent)\"><\u002Fi><\u002Fsc-if>\n              <sc-if value=\"{{ r.unpicked }}\" hint-placeholder-val=\"{{ true }}\"><i class=\"ph ph-circle\" style=\"position:relative;font-size:16px;color:var(--color-neutral-700)\"><\u002Fi><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ composer.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px 11px;text-align:center;font-size:12px;color:var(--color-neutral-500);line-height:1.6\">No one matches that. Try a unit, a wing, a role, or a name.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <span style=\"margin-right:auto;flex:0 0 auto;white-space:nowrap;font-size:11.5px;color:var(--color-neutral-500)\">{{ composer.count }} selected<\u002Fspan>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ composer.onCancel }}\">Cancel<\u002Fbutton>\n          <sc-if value=\"{{ composer.canStart }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ composer.onStart }}\">{{ composer.startLabel }}<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ report.open }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:40;backdrop-filter:blur(2px)\">\n      <div class=\"dialog\" style=\"width:min(560px,100%);animation:fadeUp .18s ease\">\n        <div>\n          <div style=\"flex:0 0 auto;white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">Reporting from {{ report.origin }}<\u002Fdiv>\n          <div cla
